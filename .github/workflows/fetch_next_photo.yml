name: Fetch next iCloud photo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch next queued photo
        run: python scripts/fetch_next_photo.py

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: rcairspotter-next-photo
          path: |
            preview/next.jpg
            preview/next.json
          if-no-files-found: error
          retention-days: 1
