name: Fetch iCloud preview batch
# stage-review-queue

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fetch_preview_batch.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh iCloud queue
        run: python scripts/sync_icloud.py

      - name: Fetch preview batch
        run: python scripts/fetch_preview_batch.py

      - name: Stage review queue
        run: |
          mkdir -p public_media/review_queue
          cp preview_batch/01_*.jpg public_media/review_queue/003.jpg
          cp preview_batch/03_*.jpg public_media/review_queue/004.jpg
          cp preview_batch/04_*.jpg public_media/review_queue/005.jpg
          cp preview_batch/05_*.jpg public_media/review_queue/006.jpg
          cp preview_batch/06_*.jpg public_media/review_queue/007.jpg
          cp preview_batch/07_*.jpg public_media/review_queue/008.jpg
          cp preview_batch/08_*.jpg public_media/review_queue/009.jpg
          cp preview_batch/09_*.jpg public_media/review_queue/010.jpg
          cp preview_batch/10_*.jpg public_media/review_queue/011.jpg
          cp preview_batch/11_*.jpg public_media/review_queue/012.jpg
          cp preview_batch/12_*.jpg public_media/review_queue/013.jpg
          cp preview_batch/13_*.jpg public_media/review_queue/014.jpg
          cp preview_batch/14_*.jpg public_media/review_queue/015.jpg
          cp preview_batch/15_*.jpg public_media/review_queue/016.jpg
          cp preview_batch/16_*.jpg public_media/review_queue/017.jpg
          cp preview_batch/18_*.jpg public_media/review_queue/018.jpg
          cp preview_batch/20_*.jpg public_media/review_queue/019.jpg
          cp preview_batch/21_*.jpg public_media/review_queue/020.jpg
          cp preview_batch/22_*.jpg public_media/review_queue/021.jpg

      - name: Commit review media
        run: |
          git config user.name "rcairspotter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public_media/review_queue
          if git diff --cached --quiet; then
            echo "No media changes."
          else
            git commit -m "media: stage 19-post review queue"
            git push
          fi

      - name: Upload preview batch
        uses: actions/upload-artifact@v4
        with:
          name: rcairspotter-preview-batch
          path: preview_batch/
          if-no-files-found: error
          retention-days: 1
