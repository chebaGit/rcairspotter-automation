name: Fetch iCloud preview batch
# batch22

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fetch_preview_batch.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh iCloud queue
        run: python scripts/sync_icloud.py

      - name: Fetch preview batch
        run: python scripts/fetch_preview_batch.py

      - name: Stage current post
        run: |
          mkdir -p public_media/002
          cp preview_batch/02_C356797B-6569-4CEB-ABBF-FA67F93B18B5.jpg public_media/002/01_current.jpg

      - name: Commit current media
        run: |
          git config user.name "rcairspotter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public_media/002
          if git diff --cached --quiet; then
            echo "No media changes."
          else
            git commit -m "media: stage current post 002"
            git push
          fi

      - name: Upload preview batch
        uses: actions/upload-artifact@v4
        with:
          name: rcairspotter-preview-batch
          path: preview_batch/
          if-no-files-found: error
          retention-days: 1
