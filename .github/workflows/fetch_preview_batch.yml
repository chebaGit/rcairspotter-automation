name: Fetch iCloud preview batch

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fetch_preview_batch.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh iCloud queue
        run: python scripts/sync_icloud.py

      - name: Fetch preview batch
        run: python scripts/fetch_preview_batch.py

      - name: Upload preview batch
        uses: actions/upload-artifact@v4
        with:
          name: rcairspotter-preview-batch
          path: preview_batch/
          if-no-files-found: error
          retention-days: 1
