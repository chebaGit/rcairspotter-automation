name: Sync iCloud album

on:
  workflow_dispatch:
  schedule:
    - cron: "17 09 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync iCloud inventory
        run: python scripts/sync_icloud.py

      - name: Commit inventory changes
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "rcairspotter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/photos.json data/published.json data/queue.json
          git commit -m "chore: sync iCloud photo inventory"
          git push
